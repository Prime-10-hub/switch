<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ANNOUNCEMENT BAR -->
    <div class="announcement-bar">

        <!-- Left Arrow -->
        <button class="ann-arrow" id="ann-prev">&#8249;</button>

        <!-- Messages Window -->
        <div class="ann-window">

            <!-- Messages Track — this is what slides -->
            <div class="ann-track">

                <!-- Clone of Message 3 (sits at the very beginning) -->
                <p class="ann-message">
                    🎉 3 Months Free for First Time Users — Cancel Anytime
                </p>

                <!-- Real Message 1 -->
                <p class="ann-message">
                    🔥 Free Delivery on Orders Above UGX 200,000
                </p>

                <!-- Real Message 2 -->
                <p class="ann-message">
                    🎓 15% Off for All Students on Subscription
                </p>

                <!-- Real Message 3 -->
                <p class="ann-message">
                    🎉 3 Months Free for First Time Users — Cancel Anytime
                </p>

                <!-- Clone of Message 1 (sits at the very end) -->
                <p class="ann-message">
                    🔥 Free Delivery on Orders Above UGX 200,000
                </p>

            </div>

        </div>

        <!-- Right Arrow -->
        <button class="ann-arrow" id="ann-next">&#8250;</button>

    </div>

    <!-- NAVBAR -->
<nav class="navbar">

    <!-- Left Zone — Logo -->
    <div class="nav-left">
        <div class="nav-logo">Switch</div>
    </div>

    <!-- Center Zone — Navigation Links -->
    <div class="nav-center">
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>

    <!-- Right Zone — Icons -->
    <div class="nav-right">

        <button class="nav-icon" id="search-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </button>

        <button class="nav-icon" id="account-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </button>

        <button class="nav-icon" id="wishlist-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
        </button>

        <button class="nav-icon cart-icon" id="cart-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"/>
                <circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span class="cart-badge" id="cart-count">0</span>
        </button>

    </div>

</nav>

    <script src="js/main.js"></script>
</body>
</html>
